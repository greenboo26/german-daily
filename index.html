<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>German Daily</title>
<style>
:root {
  --bg: #F7F3EE; --sidebar: #EEEBE6; --card: #FFFFFF;
  --text: #2C2A27; --text-secondary: #6B6762; --text-tertiary: #9C9791;
  --accent: #C96442; --accent-hover: #B85535;
  --accent-light: rgba(201,100,66,0.08);
  --border: rgba(44,42,39,0.08);
  --radius: 16px; --radius-lg: 18px;
  --font-title: 'Noto Serif SC', 'Lora', serif;
  --font-body: 'Noto Serif SC', 'Times New Roman', serif;
  --transition: 0.25s ease;
}
[data-theme="dark"] {
  --bg: #1F1E1D; --sidebar: #181716; --card: #2A2826;
  --text: #F0EBE4; --text-secondary: #D9D3CD; --text-tertiary: #B5B0A9;
  --accent: #C96442; --accent-hover: #D97A58;
  --accent-light: rgba(201,100,66,0.12);
  --border: rgba(240,235,228,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);transition:background var(--transition),color var(--transition)}
.app{display:flex;height:100vh;width:100%}
.sidebar{width:220px;flex-shrink:0;background:var(--sidebar);padding:32px 18px;display:flex;flex-direction:column;border-right:1px solid var(--border);transition:background var(--transition)}
.sidebar-logo{font-family:var(--font-title);font-size:18px;font-weight:700;color:var(--accent);letter-spacing:1px;padding:0 10px;margin-bottom:32px}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:6px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:400;color:var(--text-secondary);cursor:pointer;transition:all var(--transition);border:none;background:none;text-align:left;width:100%;letter-spacing:0.5px}
.sidebar-item:hover{color:var(--text);background:var(--accent-light)}
.sidebar-item.active{color:var(--accent);background:var(--accent-light);border:1px solid rgba(201,100,66,0.15);font-weight:400}
.sidebar-item .icon{line-height:1;display:flex;align-items:center}
.sidebar-item .icon svg{display:block}
.sidebar-bottom{margin-top:auto;padding-top:20px;border-top:1px solid var(--border)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);transition:background var(--transition)}
.main-header{display:none;padding:16px 20px;border-bottom:1px solid var(--border);align-items:center;justify-content:space-between}
.main-header .logo{font-family:var(--font-title);font-size:15px;color:var(--accent);font-weight:700}
.main-content{flex:1;overflow-y:auto;padding:28px 32px 24px;-webkit-overflow-scrolling:touch}
.main-content::-webkit-scrollbar{width:4px}
.main-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.page{display:none;max-width:600px;margin:0 auto;width:100%;animation:fadeIn 0.35s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* Search */
.search-box{position:relative;margin-bottom:18px}
.search-box input{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none;font-family:var(--font-body);transition:border var(--transition),background var(--transition)}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--text-tertiary)}
.search-results{display:none;position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-top:4px;max-height:300px;overflow-y:auto;z-index:10;padding:6px}
.search-results.show{display:block}
.search-result-item{padding:10px 14px;cursor:pointer;border-radius:8px;display:flex;justify-content:space-between;align-items:center;font-size:14px;transition:background var(--transition)}
.search-result-item:hover{background:var(--accent-light)}
.search-result-item .s-word{font-weight:500}
.search-result-item .s-meaning{color:var(--text-tertiary);font-size:13px}
/* Daily Card */
.daily-card{background:var(--card);border-radius:var(--radius-lg);padding:36px 32px;margin-bottom:20px;border:1px solid var(--border);transition:background var(--transition)}
.daily-label{font-size:11px;font-weight:500;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
.daily-progress{font-size:11px;color:var(--text-tertiary);margin-bottom:12px;letter-spacing:0.3px}
.daily-word{font-family:var(--font-title);font-size:38px;font-weight:500;letter-spacing:1.5px;margin-bottom:6px;line-height:1.3}
.daily-meaning{font-size:16px;color:var(--text-secondary);margin-bottom:18px;font-weight:300}
.daily-example{font-size:13px;color:var(--text-tertiary);font-style:italic;line-height:1.5;padding-top:14px;border-top:1px solid var(--border)}
.daily-example-cn{font-size:12px;color:var(--text-tertiary);margin-top:4px}
.daily-nav{display:flex;justify-content:space-between;margin-top:18px}
.daily-nav button{background:var(--accent-light);border:1px solid rgba(201,100,66,0.15);color:var(--accent);padding:9px 22px;border-radius:20px;font-size:13px;cursor:pointer;transition:all var(--transition);font-family:var(--font-body)}
.daily-nav button:hover{background:var(--accent);color:#fff}
/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 10px;text-align:center;transition:background var(--transition)}
.stat-num{font-family:'Inter',monospace;font-size:20px;font-weight:600;color:var(--accent)}
.stat-label{font-size:10px;color:var(--text-tertiary);margin-top:3px;letter-spacing:0.3px}
/* Quick Actions */
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.quick-btn{border-radius:16px;padding:20px 16px;text-align:center;cursor:pointer;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:500;color:var(--text);transition:all var(--transition);font-family:var(--font-body);letter-spacing:0.5px}
.quick-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.quick-btn:active{transform:scale(0.97)}
/* Speech */
.speak-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--accent-light);color:var(--accent);cursor:pointer;transition:all var(--transition);padding:0;margin-left:8px;vertical-align:middle;flex-shrink:0}
.speak-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.speak-btn:active{transform:scale(0.92)}
.speak-btn svg{width:16px;height:16px;display:block}
.speak-btn.playing{animation:pulse 0.6s ease}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.daily-word .speak-btn{width:42px;height:42px;margin-left:12px;vertical-align:middle}
.daily-word .speak-btn svg{width:20px;height:20px}
/* Flashcard */
.flash-container{display:flex;flex-direction:column;align-items:center;padding-top:8px}
.fc-header{display:flex;justify-content:space-between;width:100%;margin-bottom:14px}
.fc-header .fc-counter{font-size:13px;color:var(--text-tertiary);font-family:var(--font-title)}
.fc-header .fc-type{font-size:11px;color:var(--accent);background:var(--accent-light);padding:3px 12px;border-radius:12px;letter-spacing:0.5px}
.flashcard{width:100%;aspect-ratio:4/3;perspective:1000px;cursor:pointer;margin-bottom:16px}
.fc-inner{position:relative;width:100%;height:100%;transition:transform 0.5s ease;transform-style:preserve-3d}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;border:1px solid var(--border)}
.fc-front{background:var(--card)}
.fc-front .fc-wd{font-family:var(--font-title);font-size:34px;font-weight:500;color:var(--text);margin:8px 0;letter-spacing:0.5px}
.fc-hint{font-size:12px;color:var(--text-tertiary);font-weight:300;margin-top:12px}
.fc-back{background:var(--card);transform:rotateY(180deg)}
.fc-back .fc-mn{font-size:24px;font-weight:500;color:var(--text);margin-bottom:10px}
.fc-back .fc-ex{font-size:13px;color:var(--text-secondary);line-height:1.5;text-align:center;font-style:italic}
.fc-back .fc-ex-cn{font-size:12px;color:var(--text-tertiary);margin-top:4px}
.fc-acts{display:flex;gap:32px;margin-bottom:10px;justify-content:center;align-items:center}
.fc-acts button{width:64px;height:64px;border-radius:50%;border:1px solid var(--border);cursor:pointer;background:var(--card);color:var(--text-secondary);font-size:24px;transition:all var(--transition);display:flex;align-items:center;justify-content:center}
.fc-acts button:hover{border-color:var(--accent)}
.fc-acts .btn-dont:hover{background:rgba(200,80,80,0.1);color:#C85050;border-color:#C85050}
.fc-acts .btn-know:hover{background:rgba(201,100,66,0.1);color:var(--accent);border-color:var(--accent)}

.fc-done{text-align:center;padding:60px 20px}
.fc-done .big{font-size:48px;margin-bottom:12px}
.fc-done .text{font-size:16px;color:var(--text-secondary);margin-bottom:8px}
.fc-done .sub{font-size:13px;color:var(--text-tertiary);margin-bottom:24px}
.fc-progress{margin-bottom:16px;width:100%}
.fc-progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.fc-progress-fill{height:100%;background:var(--accent);transition:width 0.3s;border-radius:2px}
/* Grammar */
.gr-filter-wrapper{position:relative;margin-bottom:16px}
.gr-filter-bar{display:flex;gap:6px;overflow:hidden;padding-bottom:2px}
.gr-filter-bar.expanded{flex-wrap:wrap;overflow:visible}
.gr-filter-bar .filter-btn{flex-shrink:0}
.gr-toggle-btn{display:none;background:var(--accent-light);border:1px solid rgba(201,100,66,0.15);color:var(--accent);padding:6px 14px;border-radius:16px;font-size:11px;cursor:pointer;white-space:nowrap;font-family:var(--font-body);margin-top:6px}
.gr-toggle-btn:hover{background:var(--accent);color:#fff}
@media(max-width:500px){.gr-toggle-btn{display:inline-block}}
.filter-btn{padding:7px 18px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all var(--transition);font-family:var(--font-body);letter-spacing:0.3px}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.filter-btn:hover:not(.active){border-color:var(--text-tertiary)}
.filter-btn.hidden{display:none}
.gr-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:14px;transition:background var(--transition)}
.gr-card h3{font-family:var(--font-title);font-size:15px;font-weight:500;color:var(--text);margin-bottom:8px}
.gr-body{font-size:13px;line-height:1.9;color:var(--text-secondary)}
.gr-ex{background:rgba(201,100,66,0.04);border-radius:8px;padding:12px 14px;margin:10px 0 4px;font-size:12px;line-height:1.7}
.gr-ex .cn{color:var(--text-tertiary);font-size:11px}
/* Settings */
.settings-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;margin-bottom:16px;transition:background var(--transition)}
.settings-card h3{font-family:var(--font-title);font-size:16px;font-weight:600;margin-bottom:20px}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border:none}
.setting-label{font-size:14px;color:var(--text);letter-spacing:0.3px}
.setting-desc{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.setting-control{display:flex;align-items:center;gap:12px}
.setting-control input[type="number"]{width:56px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;text-align:center;outline:none;font-family:'Inter',monospace}
.setting-control input[type="number"]:focus{border-color:var(--accent)}
.setting-control .num-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
.setting-control .num-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.theme-toggle{display:flex;gap:8px}
.theme-opt{padding:8px 18px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:13px;cursor:pointer;transition:all var(--transition);font-family:var(--font-body)}
.theme-opt.active{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.vol-icon{width:18px;height:18px;color:var(--text-secondary);flex-shrink:0}
/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.35);z-index:100;backdrop-filter:blur(4px)}
.modal-overlay.active{display:block}
.modal-content{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;padding:32px;max-height:70vh;overflow-y:auto;border-top:1px solid var(--border);animation:slideUp 0.3s ease}
.modal-handle{width:32px;height:3px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.modal-word{font-family:var(--font-title);font-size:26px;font-weight:700;text-align:center;color:var(--text)}
.modal-mn{text-align:center;font-size:16px;color:var(--text-secondary);margin:6px 0 16px}
.modal-detail{font-size:13px;line-height:1.8;color:var(--text-secondary)}
.modal-detail strong{color:var(--text)}
/* Mobile nav */
.mobile-nav{display:none;height:56px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:none;background:none;color:var(--text-tertiary);font-size:9px;cursor:pointer;transition:color var(--transition)}
.mobile-nav button.active{color:var(--accent)}
.mobile-nav button svg{width:20px;height:20px}
.empty-small{text-align:center;padding:40px 20px;color:var(--text-tertiary);font-size:13px}
@media(min-width:769px){
  .main-content{padding:clamp(24px,4vh,48px) clamp(24px,4vw,96px) 24px}
  .page{max-width:960px}
  #pageFc{max-width:640px}
  .flashcard{aspect-ratio:8/5;min-height:260px}
  .fc-front .fc-wd{font-size:clamp(34px,3.1vw,60px)}
  .gr-body,.gr-ex{max-width:72ch}
}
@media(max-width:768px){
  .sidebar{display:none}
  .main-header{display:flex}
  .main-content{padding:20px 16px 16px}
  .mobile-nav{display:flex}
  .app{flex-direction:column}
  .daily-word{font-size:30px}
  .stats-row{grid-template-columns:repeat(4,1fr);gap:8px}
  .stat-card{padding:12px 6px}
  .stat-num{font-size:17px}
  .settings-card{padding:24px 20px}
}
@media(max-width:374px){.daily-word{font-size:26px}.stats-row{grid-template-columns:repeat(2,1fr)}}
</style>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body>
<div class="app" id="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">German Daily</div>
    <nav class="sidebar-nav">
      <button class="sidebar-item active" data-nav="daily"><span class="icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><circle cx="10" cy="10" r="4.5"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M3.5 3.5l1.4 1.4M15.1 15.1l1.4 1.4M3.5 16.5l1.4-1.4M15.1 4.9l1.4-1.4"/></svg></span> 首页</button>
      <button class="sidebar-item" data-nav="fc"><span class="icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><rect x="2.5" y="3" width="15" height="14" rx="2"/><path d="M10 7v6M7 10h6"/></svg></span> 闪卡</button>
      <button class="sidebar-item" data-nav="grammarDay"><span class="icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M3 4h14v12H3z"/><path d="M6 2v2M14 2v2M3 7h14"/><path d="M6 10h2M10 10h2"/></svg></span> 每日语法</button>
      <button class="sidebar-item" data-nav="settings"><span class="icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><circle cx="10" cy="10" r="2.5"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6l1.4 1.4M4 16l1.4-1.4M14.6 5.4l1.4-1.4"/></svg></span> 设置</button>
    </nav>
    <div class="sidebar-bottom">
      <div style="font-size:11px;color:var(--text-tertiary);padding:0 14px;letter-spacing:0.3px" id="dateDisplayDesktop"></div>
    </div>
  </aside>
  <!-- Main -->
  <div class="main">
    <div class="main-header">
      <span class="logo">German Daily</span>
      <span style="font-size:12px;color:var(--text-tertiary)" id="dateDisplayMobile"></span>
    </div>
    <div class="main-content" id="mainContent">
      <!-- Daily Page -->
      <div class="page active" id="pageDaily">
        <div class="search-box">
          <input type="text" id="globalSearch" placeholder="搜索单词...">
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="daily-card">
          <div class="daily-label">今日单词</div>
          <div class="daily-progress" id="dailyProgress"></div>
          <div class="daily-word" id="dw"></div>
          <div class="daily-meaning" id="dm"></div>
          <div class="daily-example" id="de"></div>
          <div class="daily-example-cn" id="dec"></div>
          <div class="daily-nav">
            <button data-cmd="prev">← 上一张</button>
            <button data-cmd="next">下一张 →</button>
          </div>
        </div>
        <div class="stats-row">
          <div class="stat-card"><div class="stat-num" id="st1">0</div><div class="stat-label">总词汇</div></div>
          <div class="stat-card"><div class="stat-num" id="st2">0</div><div class="stat-label">学习天数</div></div>
          <div class="stat-card"><div class="stat-num" id="st3">0</div><div class="stat-label">已掌握</div></div>
          <div class="stat-card"><div class="stat-num" id="st4">0</div><div class="stat-label">待复习</div></div>
        </div>
        <div class="quick-actions">
          <button class="quick-btn" data-nav="fc"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16" style="vertical-align:-2px;margin-right:4px"><rect x="2" y="2.5" width="14" height="13" rx="2"/><path d="M9 5.5v6M6 8.5h6"/></svg> 开始闪卡</button>
          <button class="quick-btn" data-nav="grammar"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16" style="vertical-align:-2px;margin-right:4px"><path d="M3 15.5A2 2 0 0 1 5 13.5h10"/><path d="M5 2.5h10v15H5a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2z"/><path d="M7 5.5h5M7 8h5"/></svg> 语法速查</button>
          <button class="quick-btn" data-nav="settings"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16" style="vertical-align:-2px;margin-right:4px"><circle cx="9" cy="9" r="2.5"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.5 3.5l1.5 1.5M13 13l1.5 1.5M3.5 14.5l1.5-1.5M13 5l1.5-1.5"/></svg> 学习设置</button>
          <button class="quick-btn" onclick="goto('grammarDay')"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16" style="vertical-align:-2px;margin-right:4px"><path d="M2 4h3l3 10 2-7 2 7 3-10h3"/><path d="M15 12h2v3h-3"/></svg> 每日语法</button>
        </div>
      </div>
      <!-- Flashcard -->
      <div class="page" id="pageFc">
        <div id="fcContent"></div>
      </div>
      <!-- Grammar -->
      <div class="page" id="pageGrammar">
        <div class="gr-filter-wrapper">
          <div class="gr-filter-bar" id="gf"></div>
          <button class="gr-toggle-btn" id="grToggle">展开全部 ▾</button>
        </div>
        <div id="gl"></div>
      </div>
      <!-- Settings -->
      <div class="page" id="pageGrammarDay"><div id="grammarDayContent"></div></div>

var GT = [{"tips": "词干+人称词尾：ich-e, du-st, er/sie/es-t, wir-en, ihr-t, sie/Sie-en。注意arbeiten词干以-t结尾先加-e。", "questions": [{"q": "ich ___ (lernen) Deutsch", "a": "lerne", "opts": ["lerne", "lernst", "lernt"]}, {"q": "du ___ (arbeiten) gern", "a": "arbeitest", "opts": ["arbeitest", "arbeitet", "arbeiten"]}, {"q": "Er ___ (machen) Hausaufgaben", "a": "macht", "opts": ["mache", "machst", "macht"]}]}, {"tips": "区分du(你)和Sie(您)：朋友用du，长辈用Sie。Bis+时间=到…见：Bis morgen!/Bis dann!", "questions": [{"q": "早上好！", "a": "Guten Morgen!", "opts": ["Guten Abend!", "Guten Morgen!", "Gute Nacht!"]}, {"q": "明天见！", "a": "Bis morgen!", "opts": ["Bis dann!", "Bis morgen!", "Bis gleich!"]}, {"q": "您叫什么名字？", "a": "Wie ist Ihr Name?", "opts": ["Wie ist dein Name?", "Wie heit du?", "Wie ist Ihr Name?"]}]}, {"tips": "不规则动词只在du/er/sie/es变音，其他不变。haben(有)要记：ich habe, du hast, er hat。sein完全不规则。", "questions": [{"q": "Herr Wang ___ (lesen) ein Buch.", "a": "liest", "opts": ["lest", "liest", "lese"]}, {"q": "___ (fahren) du nach Berlin?", "a": "Fahrst", "opts": ["Fahrst", "Fahrt", "Fahre"]}, {"q": "Ich ___ (sein) aus China.", "a": "bin", "opts": ["bin", "bist", "ist"]}]}, {"tips": "只有阳性冠词变：der->den, ein->einen。代词：mich/dich/ihn/sie/es。wen问人，was问物。", "questions": [{"q": "Ich habe ___ (ein) Tisch.", "a": "einen", "opts": ["ein", "einen", "eine"]}, {"q": "Ich besuche ___ (du).", "a": "dich", "opts": ["dir", "dich", "du"]}, {"q": "___ fragt der Lehrer? Den Schuler.", "a": "Wen", "opts": ["Wer", "Wen", "Wem"]}]}, {"tips": "um+钟点(um acht/um halb sieben)。am+时段(am Morgen/am Abend)。数字21-99=个位+und+十位。", "questions": [{"q": "我六点半起床。", "a": "Ich stehe um halb sieben auf.", "opts": ["Ich stehe um sieben auf.", "Ich stehe um halb sieben auf.", "Ich stehe um Viertel nach sechs auf."]}, {"q": "Es ist ___ (8:15).", "a": "Viertel nach acht", "opts": ["Viertel nach acht", "Viertel vor acht", "acht Uhr funfzehn"]}, {"q": "Am ___ habe ich Unterricht. (上午)", "a": "Am Vormittag", "opts": ["Am Vormittag", "Am Nachmittag", "Am Abend var GR = [{"unit": 1, "title": "人称代词 + 规则动词", "content": "人称代词: ich(我) / du(你) / er(他) / sie(她) / es(它) / wir(我们) / ihr(你们) / sie(他们) / Sie(您)<br><br>规则动词变位: 词干 + 人称词尾<br>ich → -e &nbsp; du → -st &nbsp; er/sie/es → -t<br>wir → -en &nbsp; ihr → -t &nbsp; sie/Sie → -en<br><br>词干以 -t/-d/-ffn/-chn/-gn 结尾时, -st/-t 前加 -e", "examples": [["Ich heie Wang Hong. Wer bist du?", "我叫王宏。你是谁？"], ["Woher kommst du? Ich komme aus China.", "你从哪里来？我来自中国。"], ["Was machst du? Ich lerne Deutsch.", "你在做什么？我在学德语。"]]}, {"unit": 2, "title": "问候·bis", "content": "常用问候语:<br>Guten Morgen! / Guten Tag! / Guten Abend! / Gute Nacht!<br>Auf Wiedersehen! (再见)<br><br>Bis + 时间 = 到见: Bis morgen! / Bis dann! / Bis gleich!", "examples": [["Guten Morgen! Wie geht es Ihnen?", "早上好！您好吗？"], ["Hallo! Wie heit du?", "你好！你叫什么名字？"], ["Auf Wiedersehen! Bis morgen!", "再见！明天见！"]]}, {"unit": 3, "title": "不规则动词现在时", "content": "强变化动词在 du/er/sie/es 时换音:<br>essen (吃): isst / lesen (阅读): liest / geben (给予): gibt<br>sehen (看): sieht / sprechen (说): spricht<br>fahren: fahrt / laufen: lauft<br>haben: hast/hat / sein: bist/ist", "examples": [["Herr Wang liest ein Buch. Was liest du?", "王先生在读书。你在读什么？"], ["Sprichst du Deutsch? Ja, ich spreche Deutsch.", "你说德语吗？是的，我说德语。"], ["Fahrst du mit dem Auto? Nein, ich fahre Rad.", "你开车吗？不，我骑自行车。"], ["Hast du Zeit? Ja, ich habe Zeit.", "你有时间吗？是的，我有时间。"]]}, {"unit": 4, "title": "第四格 Akkusativ", "content": "冠词第四格 (只有阳性变化):<br>der → den / ein → einen<br>阴性/中性不变<br><br>人称代词第四格:<br>ich→mich / du→dich / er→ihn<br>wir→uns / ihr→euch", "examples": [["Ich habe einen Tisch und einen Stuhl.", "我有一张桌子和一把椅子。"], ["Hast du einen Kaffee? Ja, ich trinke einen Kaffee.", "你要一杯咖啡吗？是的。"], ["Der Lehrer fragt den Schuler.", "老师问学生。"], ["Besuchst du mich? Ja, ich besuche dich.", "你来看我吗？是的。"]]}, {"unit": 5, "title": "时间表达与数字", "content": "基数词: 0-12单独 / 13-19=个位+zehn / 20-90=个位+zig / 21-99=个位+und+十位<br>100=hundert / 1000=tausend<br><br>钟点: um + 时间 / 时段: am Morgen/Vormittag/Nachmittag/Abend", "examples": [["Um wie viel Uhr stehst du auf? Ich stehe um halb sieben auf.", "你几点起床？我六点半起床。"], ["Am Vormittag habe ich Unterricht. Von acht bis zwolf.", "上午我有课。从八点到十二点。"], ["Hast du heute Zeit? Nein, ich habe keine Zeit.", "你今天有时间吗？不，没有。"]]}, {"unit": 6, "title": "情态动词 mogen / mochte", "content": "变位: ich mag/mochte / du magst/mochtest / er mag/mochte<br>wir mogen/mochten / ihr mogt/mochtet<br><br>A: 助动词 mochte+Inf: Ich mochte Deutsch lernen.<br>B: 独立动词: mochte=想要 / mogen=喜欢", "examples": [["Ich mochte Deutsch lernen. Was mochtest du lernen?", "我想学德语。你想学什么？"], ["Mochtest du einen Kaffee? Ja, gerne!", "你想来杯咖啡吗？好的！"], ["Magst du Musik? Ja, ich mag Musik.", "你喜欢音乐吗？是的。"]]}, {"unit": 7, "title": "第三格 Dativ", "content": "冠词第三格: 阳dem/einem / 阴der/einer / 中dem/einem<br>复数: den + 名词加-n<br><br>人称代词第三格: ich→mir / du→dir / er→ihm<br>语序: 先三后四 / 先代后名 / 先四后三", "examples": [["Wie geht es dir? Mir geht es gut.", "你好吗？我很好。"], ["Der Lehrer erklart dem Schuler den Text.", "老师给学生解释课文。"], ["Hans hilft seinem Freund.", "汉斯帮助他的朋友。"], ["Kannst du mir helfen? Ja, ich helfe dir.", "你能帮我吗？是的。"]]}, {"unit": 8, "title": "命令式 Imperativ", "content": "du 命令式:<br>规则: 词干+(e)! / 变音动词不变音 / 换音动词换音<br>haben→Hab! / sein→Sei!<br><br>ihr 命令式: 直接用 ihr 变位形式", "examples": [["Sprich bitte langsam!", "请说慢点！"], ["Warte bitte auf mich!", "请等我！"], ["Fahr nicht zu schnell!", "别开太快！"], ["Sei bitte ruhig!", "请安静！"], ["Offnet die Bucher auf Seite 4!", "请翻开书第4页！"]]}, {"unit": 9, "title": "可分动词·否定·物主代词", "content": "可分动词: 前缀+根动词, 主句中前缀后置句末<br>例: aufstehen → Ich stehe um 6 Uhr auf.<br>vorhaben → Was hast du morgen vor?<br><br>零冠词: 职业/国籍作表语无冠词(Er ist Lehrer), 物质名词(trinkt Tee), 泛指复数(Das sind Bücher)<br><br>否定: kein + 名词(keine Zeit), nicht 否定其他(nicht heute)<br>ja/nein/doch: 不带否定词用ja/nein, 带否定词用doch/nein<br><br>物主代词N/A: mein/meinen, dein/deinen, sein/seinen, ihr/ihren, unser/unseren, euer/euren, Ihr/Ihren", "examples": [["Hast du heute Zeit? — Nein, ich habe keine Zeit.", "你今天有时间吗？不，我没有。"], ["Lernt Peter nicht fleiig? — Doch, er lernt fleiig.", }
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'){di--;rd()}
  if(e.key==='ArrowRight'){di++;rd()}
  if(e.key===' '){
    var fc=document.getElementById('fc');
    if(fc){fc.classList.toggle('flipped');e.preventDefault()}
  }
});
</script>
</body>
</html>
